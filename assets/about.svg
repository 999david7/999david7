<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="623" viewBox="0 0 880 623" role="img" aria-label="About David Winkler">
<defs>
<style>
@font-face { font-family: 'PSerif'; src: url(data:font/woff2;base64,) format('woff2'); }
text { fill: #17140F; }
.in { animation: rise 1.1s cubic-bezier(.33,1,.68,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
/* the signature writes itself in from left to right, like the portfolio footer */
.sign { animation: write 1.6s cubic-bezier(.65,0,.35,1) .6s both; }
@keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

</defs>
<rect x="0.5" y="0.5" width="879" height="622" rx="16" fill="#FCFBF8" stroke="#17140F" stroke-opacity="0.08"/>
<g class="in" style="animation-delay:0.10s"><text x="64.0" y="74.0" font-family="PSerif" font-size="15" fill-opacity="0.34" letter-spacing="3.90">ABOUT</text></g>
<g class="in" style="animation-delay:0.24s"><text x="64.0" y="126.0" font-family="PSerif" font-size="27">From Innsbruck. I build programs that are fast, clean, and</text><text x="64.0" y="164.0" font-family="PSerif" font-size="27">just work.</text></g>
<g class="in" style="animation-delay:0.38s"><text x="64.0" y="216.0" font-family="PSerif" font-size="23" fill-opacity="0.56">Most of what I do sits where engineering meets design — interfaces</text><text x="64.0" y="249.0" font-family="PSerif" font-size="23" fill-opacity="0.56">that load instantly, read clearly, and feel good to use. Your mentality is</text><text x="64.0" y="282.0" font-family="PSerif" font-size="23" fill-opacity="0.56">your limit.</text><text x="64.0" y="329.0" font-family="PSerif" font-size="23" fill-opacity="0.56">Currently studying at HTL Anichstraße, running bean4U, and taking</text><text x="64.0" y="362.0" font-family="PSerif" font-size="23" fill-opacity="0.56">on freelance work in web development and UI.</text></g>
<g class="in" style="animation-delay:0.52s"><text x="64.0" y="429.0" font-family="PSerif" font-size="15" fill-opacity="0.34" letter-spacing="3.90">EDUCATION</text><rect x="64" y="459.0" width="752" height="1" fill="#17140F" fill-opacity="0.12"/><text x="64.0" y="510.6" font-family="PSerif" font-size="30">HTL Anichstraße</text><text x="816.0" y="510.6" font-family="PSerif" font-size="17" fill-opacity="0.34" text-anchor="end">Since 2025</text><text x="64.0" y="540.6" font-family="PSerif" font-size="18" fill-opacity="0.56">Technical college in Innsbruck — engineering fundamentals</text><rect x="64" y="568.6" width="752" height="1" fill="#17140F" fill-opacity="0.12"/></g>
</svg>
