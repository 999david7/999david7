<rect width="716" height="214" rx="14" fill="url(#haze)"/>
<rect x="0.5" y="0.5" width="715" height="213" rx="14" fill="none" stroke="url(#edge)" stroke-opacity="0.8"/>
<circle cx="20" cy="18" r="5" fill="#ff5f56"/><circle cx="37" cy="18" r="5" fill="#ffbd2e"/><circle cx="54" cy="18" r="5" fill="#27c93f"/>
