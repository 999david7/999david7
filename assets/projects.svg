<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="446" viewBox="0 0 880 446" role="img" aria-label="Projects: AI &amp; Automation — AI-powered tools, agents and automation experiments. (Python, FastAPI, LLMs, RAG); Web Projects — Building applications and experimenting with new ideas. (TypeScript, React, Next.js); Random Stuff — Side projects, experiments and things I build because I can. (Python, Docker, Git)">
<defs>
<style>
@font-face { font-family: 'PDisplay'; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'PSerif'; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'PSerif5'; src: url(data:font/woff2;base64,) format('woff2'); }
text { fill: #17140F; }
.in { animation: rise 1.1s cubic-bezier(.33,1,.68,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
/* the signature writes itself in from left to right, like the portfolio footer */
.sign { animation: write 1.6s cubic-bezier(.65,0,.35,1) .6s both; }
@keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

